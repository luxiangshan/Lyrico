name: Build Windows (Lyrico Mod Desktop)

on:
  push:
    branches: [ master, windows ]
    tags: [ 'v*-mod' ]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + end-to-end + headless UI tests (Windows)
        run: ./gradlew.bat --no-daemon --console=plain test

      - name: End-to-end report
        if: always()
        run: |
          Get-ChildItem build/e2e-report -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { "==== $($_.Name)"; Get-Content $_.FullName -Encoding UTF8 }
          $xml = Get-ChildItem build/test-results/test -Filter *.xml -ErrorAction SilentlyContinue
          $t = 0; $f = 0; $s = 0
          foreach ($x in $xml) { [xml]$d = Get-Content $x.FullName -Encoding UTF8; $t += [int]$d.testsuite.tests; $f += [int]$d.testsuite.failures + [int]$d.testsuite.errors; $s += [int]$d.testsuite.skipped }
          "TESTS total=$t failed=$f skipped=$s"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            desktop/build/reports/tests/test
            desktop/build/test-results/test
            desktop/build/e2e-report
          if-no-files-found: ignore

      - name: Package MSI and app image
        run: ./gradlew.bat --no-daemon --console=plain packageDistributionForCurrentOS createDistributable

      - name: Self-test the packaged app (bundled JRE, tags, LRC, GraalJS)
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "build/compose/binaries/main/app/Lyrico Mod/Lyrico Mod.exe" -ArgumentList @("--selftest", "`"$report`"") -Wait -PassThru
          if (Test-Path $report) { Get-Content $report -Encoding UTF8 } else { throw "self-test wrote no report (exit $($p.ExitCode))" }
          if (-not (Select-String -Path $report -Pattern "SELFTEST OK" -Quiet)) { throw "self-test failed" }

      - name: Show jpackage logs on failure
        if: failure()
        run: Get-ChildItem -Recurse build/compose/logs -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { "==== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }

      - name: Collect artifacts
        id: collect
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          $out = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $msi = Get-ChildItem -Recurse -Path build/compose/binaries/main/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          Copy-Item $msi.FullName (Join-Path $out "LyricoMod-1.7.0-$short-windows-x64.msi")
          $app = "build/compose/binaries/main/app/Lyrico Mod"
          if (-not (Test-Path "$app/Lyrico Mod.exe")) { throw "app image not found" }
          if (-not (Test-Path "$app/runtime")) { throw "bundled runtime missing" }
          Compress-Archive -Path $app -DestinationPath (Join-Path $out "LyricoMod-1.7.0-$short-windows-x64-portable.zip") -CompressionLevel Optimal
          Get-ChildItem $out | Format-Table Name, Length
          "short=$short" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: LyricoMod-windows-${{ steps.collect.outputs.short }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to formal release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          bash .github/scripts/ensure-release.sh "$tag"
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish prerelease
        if: github.ref == 'refs/heads/windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "win-${{ steps.collect.outputs.short }}"
          $files = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist") | ForEach-Object { $_.FullName }
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          $notes = Join-Path $env:GITHUB_WORKSPACE "desktop/RELEASE_NOTES.md"
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target ${{ github.sha }} --prerelease --title "Lyrico Mod for Windows 1.7.0 ($tag)" --notes-file $notes
